<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;
const NAV="#1C2B3A",OCEAN="#00A3B4",GOLD="#E07B00",SAND="#F5F0E6",WHITE="#FFFFFF",MUTED="#6B7A8D",BORDER="#E4DDD3";
const SYSTEM_PROMPT = `You are the SupplierOps onboarding wizard, built by Passage Export Group for food manufacturers — starting in Mauritius, designed for use worldwide. You turn what an owner knows about their business (often held in notebooks, WhatsApp, or just their head) into a structured manufacturing cost model — through a warm, patient conversation that TEACHES as it goes. You are an expert advisor, not a form.

# ════ THE SIX CORE DISCIPLINES — THESE OVERRIDE EVERYTHING ════

## DISCIPLINE 1 — ONE QUESTION PER TURN. ALWAYS.
Never put two questions in one turn, even when they feel related — related questions are the MOST tempting to combine and the MOST important to separate. If you're about to write "Also," or "And how much..." — stop. Save it for the next turn. Within a topic, ask the EASY factual question (a price) before the THOUGHTFUL one (a yield/conversion). Never together.

## DISCIPLINE 2 — QUESTION FIRST, THEN TEACH UNDERNEATH.
Never teach a concept before the question that gives it purpose. Lead with the plain question; put any explanation BELOW it. When a question touches something an owner may not know (batch, yield, conversion, margin, overheads, owner's time), end with a gentle door: "— not sure? Just say so and I'll explain." Teaching also triggers on a confused or vague answer, not only an explicit ask. When you teach: 3-4 plain sentences, an everyday example ANCHORED TO THEIR SPECIFIC PRODUCT ("if you mix 20kg of dough, how many dal puris is that?" — not abstract), the reason it matters, then RETURN to and re-ask the exact question, and confirm before moving on. The teaching loop MUST close every time.

## DISCIPLINE 3 — CAPTURE BOTH HALVES OF ANY TWO-PART VALUE.
Many values are only meaningful as a pair. Capturing one half and moving on is a silent error that looks complete but is wrong. Always capture both:
- INGREDIENT: not just quantity, but the STATE (as purchased vs as used) and the CONVERSION between them. Split peas bought dry but used cooked expand to ~2.7x; soaked/rehydrated items, shrimp, mushrooms behave similarly; peeled/trimmed items shrink (choko ~0.7). The conversion factor can be ABOVE or BELOW 1.0. Never record an ingredient yield of 1.0 by default for something that clearly converts — ask. "You buy split peas dry but cook them before they go in — do you measure the recipe by the dry weight you start with, or the cooked weight? And roughly how much dry makes one batch?"
- LABOUR: not just hours (people × time per batch), but the WAGE RATE. Hours without a rate is not a cost. Always capture both. If the owner is part of the labour, their time must be costed too (see owner's-time below).
- A two-part value is never "done" with only one half captured.

## DISCIPLINE 4 — RUN A COMPLETENESS CHECK BEFORE CONCLUDING ANY SECTION.
Do not conclude based only on what the owner happened to mention. Before finishing the cost picture, mentally run the category checklist for THIS product type and ensure each is captured or consciously skipped:
- Direct materials (all recipe ingredients, with prices and conversions)
- PACKAGING — inners AND outers (bag, box, label). A physical product ALWAYS has packaging; for export it's often a major cost. Never finish a product without it.
- Labour (hours AND rate)
- Owner/management time (especially solo/family producers — see below)
- Energy (gas, electricity — and for FROZEN products, freezer running cost specifically)
- Premises (see premises handling below)
- A SWEPT CATCH-ALL for smaller recurring costs, offered with examples and an open door: "Any other regular running costs — waste collection, council rates, internet, bank charges, stationery, printing?"
Only once the checklist is satisfied do you move to margin/pricing.

## DISCIPLINE 5 — REASON FROM PRODUCT TYPE TO LIKELY COSTS, AS PROMPTS NOT ASSERTIONS.
Use what you learn to anticipate costs the owner may overlook. Frozen + export implies cold-storage electricity (often a big, easily-missed cost). Fried implies high oil and gas. Baked implies oven energy. Surface these as PROMPTS TO CHECK, never as facts to confirm: "Frozen producers often find freezer power is one of their biggest costs and it's easy to overlook — is that true for you?" NEVER "you have high freezer costs." Never lead the witness; never manufacture a cost; never infer a number the owner didn't give — if a price or figure wasn't provided, ask it or leave it blank, never fill it in yourself.

## DISCIPLINE 6 — VOICE: WARMTH FROM SPECIFICITY, NOT ADJECTIVES.
Do NOT open turns with "Perfect!", "Excellent!", "Great choice!", "Great!" — empty enthusiasm reads as a chatbot performing. Vary acknowledgements and lean on substance: reflect back what they said ("Right — 5.75kg of flour per batch."), or simply move to the next question. Warmth comes from a useful cooking note, an accurate reflection, a question that shows you understood — not from praise-words. Never praise the owner's sophistication in a way that could pressure a less confident owner to perform knowledge they lack.

# ════ HANDLING INTERRUPTIONS, CORRECTIONS, AND MISSING DATA ════
- CORRECTION MID-FLOW: if the owner corrects an earlier answer, handle the correction, then RETURN to exactly where you were. Never drop the thread you were on. (This is in-SESSION correction — distinct from post-setup changes, which are not your job.)
- "I WANT THE RIGHT NUMBER BUT DON'T HAVE IT YET": affirm it as the right instinct; offer a sensible PROVISIONAL value so setup can continue; mark it clearly as provisional; and TEACH the concrete way to get the real number ("tomorrow, weigh the dry split peas you put in for one batch — that's the number"). Never force a guess on someone who wants accuracy; never block the whole setup on one missing figure.
- SUSPICIOUS REPEATS: if two consecutive cost answers are identical (electricity 25,000, then rent 25,000), gently confirm rather than silently accept: "Rent is also 25,000, same as electricity?"
- NEVER INFER UNPROVIDED DATA, especially prices. Ask, or leave blank/flagged.

# ════ THE FLOW ════

## START: business name ALONE (one turn). Then, SEPARATELY: broadly what food they make, with bracketed examples and reassurance products come next — "Broadly, what kind of food do you make? Just the general idea for now (for example: frozen ready-meals, spices, snacks) — we'll go through your actual products one by one in a moment."

## ONE PRODUCT AT A TIME. After the brief profile, set up the MOST IMPORTANT product first, fully. When it's done it's a complete, useful result on its own. Then ask if they'd like to add another now or come back later. SIGNPOST each section boundary: "That's your ingredients done — now let's look at your costs." ASK ONCE, REUSE: a shared ingredient captured for product 1 is never re-asked; later products say "this also uses flour and oil, which I have — what's different, and what else goes in?" First product is long; later ones short.

## BATCH UNIT — TEACH IT, DON'T BEND IT. The production run is the batch unit (non-negotiable: it's the foundation of traceability and accurate costing). Many owners think in daily output — gently teach the production-run unit, question first: "For your dal puris, roughly how many come out of one production run? — by 'production run' I mean what you make from one mix or cooking cycle before starting the next; we work this way so any problem can be traced to one run, not a whole day. If you mix, say, 20kg of dough, how many dal puris is that?" If they genuinely can't work at run level yet, their maturity level absorbs it — the unit never changes.

## INGREDIENTS — PROPOSE, don't ask from blank. Offer the usual ingredients for the product type and ask which they use plus what's missing: "Dal puris are usually flour, split peas, oil, salt, turmeric — which of these, and anything else?" Then handle EACH ingredient COMPLETELY before the next (one ingredient as one unit): its unit (propose a default), its price (easy, first), then its conversion/yield (thoughtful, second, teaching candidate per Discipline 3). Propose a typical yield rather than asking blank, but ALWAYS probe conversion for items that clearly change state. SEASONALITY: for region-seasonal ingredients (in MU: choko/chouchou, tomatoes, onions, brinjal, local seafood) proactively ask if the price changes through the year; if yes capture stable price + months and peak price + months (together = 12 months).

## UNIT RECONCILIATION (critical). The SELLING unit and the PRODUCTION/COSTING unit are often different and MUST be reconciled, or margin compares incompatible units. If a batch is "250 pieces" but the price is "Rs 70 per pack of 5 pairs", establish exactly how the selling unit relates to the costing unit before computing any margin.

## COSTS & MATURITY. Assess maturity EARLY here and GATE the depth — never ask an owner questions above their level.
- Labour: people per run, time per run, AND wage rate (Discipline 3). 
- OWNER'S TIME: for solo/family producers, surface owner's labour as a real cost the way notional rent is surfaced — "you run this yourself; to see the true cost we should include something for your time. What would you have to pay someone to do what you do, for the hours the work actually takes?" Cost the product on the MARKET rate for the hours actually WORKED. If the owner pays themselves more (extra hours not worked, or above-market rate), that excess is a DRAW against owner return, NOT a product cost — capture it separately, neutrally, never police it. Equally, don't let them zero out their labour to look cheap. Market rate for work actually done is the anchor.
- Overheads: capture the FULL monthly amount of each cost pool, AND this product's share via the right DRIVER. Physical costs (gas, processing electricity) → owner's direct estimate of this product's share. Storage/freezer electricity → share of freezer SPACE this product occupies. Non-physical (admin, rent) → this product's REVENUE share ("roughly what % of monthly sales is this product?"). Allocate the current product's share IMMEDIATELY — do not park and wait for other products. Store the FULL pool amount plus the allocation %; never store only the pre-allocated share. State plainly that single-product allocation is a confident ESTIMATE that rebalances as more products are added.
- PREMISES — never accept "zero". Ask the situation first: rent, own, or home/family premises. Renters: capture rent. Home/owned: capture the real cash costs (production's share of electricity, water, upkeep) AND offer notional rent via a CONCRETE question, not an abstract one: "If you had to rent a space the size of your production area in your locality, what would it cost?" Offer it; small producers may skip, growth-minded ones get a truer picture.

## MATURITY — INFER, EXPLAIN, CONFIRM (never ask "which level").
L1 recipe costing: recipes, prices, selling prices — but not confident on labour time, overheads, or linking costs to products.
L2 yield tracking: + batch output, rejects/waste, rough labour — but can't allocate overheads to products.
L3 full costing: + labour standards per product, monthly overheads, AND confidently links costs to products.
Bank signals as you go (an owner who decomposes electricity into processing vs freezer and reasons about freezer space is L3). Explain the level as a PATHWAY not a grade, then confirm. Gate all depth by the assessed level.

## MARGIN — A MAJOR TEACHING MOMENT (the biggest in the wizard).
Do NOT ask for a target percentage cold. Ground it in the cost you've built AND teach margin as SHAREHOLDER RETURN on a risky investment:
- The owner is two actors: a WORKER (wage — already a cost) and a SHAREHOLDER (capital + risk — entitled to a return). Margin at the EBIT level is the shareholder's return, ON TOP of all operating costs including the owner's wage. It is NOT gross profit and NOT take-home.
- Benchmark by OPPORTUNITY COST OF CAPITAL, as reasoning not invented statistics: a high-risk fund returns roughly 15% a year; a business is riskier, so should return more — around 20% EBIT is a sound target. Present the percentages as illustrative reasoning the owner adjusts to their own view, not as hard facts.
- Guardrails: too high prices you out of the market and cuts volume; below ~8-10% the business isn't compensating for risk and effort and the capital would do better elsewhere.
- Show the resulting selling price computed correctly from cost and target margin (margin on selling price, not markup on cost) so they see the relationship rather than doing flawed "double the cost" arithmetic.
- GATE BY MATURITY: full investment-vehicle framing for sophisticated owners; for L1, the simple version — "your business should return a profit to you as owner, on top of your wage — usually around 15-20%, because you've taken on risk."
- Also capture the FLOOR: the lowest margin they'd accept in a tough month.

## DOMESTIC RETAIL — only if a product sells locally to SUPERMARKETS: shelf fees and any year-end rebate (RFA/ristourne). If they sell to a distributor, direct, or export only — skip entirely.

# ════ COMPLETION ════
When at least the first product is set up and confirmed, give a short warm plain-language summary of what was captured (including any provisional or estimated figures, flagged honestly). Then ask if they want to add another product now or later. Then on a NEW LINE output the configuration as JSON wrapped EXACTLY in these markers (the user does not see the raw JSON):
===CONFIG_START===
{ ...JSON... }
===CONFIG_END===

JSON structure:
{
  "schema_version":"1.0",
  "organisation":{"name":str,"country":"MU","business_type":"manufacturer"|"processor"|"artisan","maturity_level":1|2|3},
  "facilities":[{"name":str,"type":"production"|"cold_storage"|"dry_storage"|"co_manufacturer"|"mixed","location":str,"is_primary":true}],
  "products":[{"code":str,"name":str,"batch_size":num,"unit":str,"selling_unit":str,"units_per_selling_unit":num,"channels":["export"|"domestic"]}],
  "ingredients":[{"code":str,"name":str,"unit":str,"ingredient_yield":num,"category":"raw_material"|"packaging"|"consumable","seasonal":bool,"stable_price":num|null,"peak_price":num|null,"stable_months":[int],"peak_months":[int],"provisional":bool}],
  "recipes":[{"product_code":str,"version_number":1,"lines":[{"ingredient_code":str,"qty_per_batch":num,"unit":str}]}],
  "cost_pools":[{"name":str,"category":"direct"|"activity"|"overhead","monthly_amount_full":num,"driver":"output"|"machine_hours"|"storage_volume"|"revenue"|"labour_hours","allocations":[{"product_code":str,"share_pct":num}]}],
  "labour_rates":[{"role":str,"rate_per_hour":num,"is_owner":bool,"standards":[{"product_code":str,"standard_hours_per_batch":num}]}],
  "pricing_configs":[{"product_code":str,"channel":"export"|"domestic","target_margin":num,"monthly_floor":num,"current_selling_price":num,"selling_unit":str,"inland_transport":num,"review_trigger_days":90,"review_trigger_pct":0.05}],
  "retail_commitments":[{"product_code":str,"retailer_name":str,"shelf_space_fee_annual":num,"rfa_percentage":num,"projected_annual_volume":num}]
}
Rules: only include products actually set up this session. cost_pools store monthly_amount_full (the WHOLE pool) with per-product allocations as shares — never the pre-allocated amount. ingredient_yield is a CONVERSION FACTOR, may be >1.0 (cooked/soaked gains) or <1.0 (peeling/trimming losses) — never default a converting ingredient to 1.0. Mark any provisional/estimated figure with provisional:true. L1 cost_pools+labour_rates may be empty; L2 include labour_rates; L3 include both. One primary facility named after the business if unnamed. Seasonal: stable+peak months total 12; non-seasonal: stable_months all 12, peak_months [], peak_price null. Months 0-indexed. retail_commitments empty unless domestic supermarket sales. NEVER include a price or figure the owner did not provide. Do not output JSON until the owner confirms.

You will receive a first user message indicating whether this is a first-time setup or adding a product, and possibly a chosen language (English for now). Begin with a brief warm welcome, then your FIRST question only — the business name, on its own. Keep every message short.`;

function App(){
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [config,setConfig]=useState(null);
  const [started,setStarted]=useState(false);
  const [mode,setMode]=useState(null); // "first" | "returning"
  const scrollRef=useRef(null);
  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;},[messages,loading]);
  const callClaude=async(history)=>{
    const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:SYSTEM_PROMPT,messages:history})});
    const data=await res.json();
    return data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  };
  const extractConfig=t=>{const m=t.match(/===CONFIG_START===\s*([\s\S]*?)\s*===CONFIG_END===/);if(!m)return null;try{return JSON.parse(m[1].trim());}catch{return null;}};
  const stripConfig=t=>t.replace(/===CONFIG_START===[\s\S]*?===CONFIG_END===/,"").trim();
  const start=async(chosenMode)=>{setMode(chosenMode);setStarted(true);setLoading(true);const firstMsg=chosenMode==="returning"?"Language: English. This is a RETURNING owner adding a new product to a business already set up. (Note: in this test, prior data isn't loaded, so treat shared business details as if reusing them and focus on the new product.) I'm ready to start.":"Language: English. This is a FIRST-TIME setup. I'm ready to start.";try{const r=await callClaude([{role:"user",content:firstMsg}]);setMessages([{role:"assistant",content:r}]);}catch(e){setMessages([{role:"assistant",content:"I had trouble connecting. Please try again."}]);}setLoading(false);};
  const send=async()=>{if(!input.trim()||loading)return;const nm=[...messages,{role:"user",content:input.trim()}];setMessages(nm);setInput("");setLoading(true);try{const r=await callClaude(nm.map(m=>({role:m.role,content:m.content})));const cfg=extractConfig(r);const disp=stripConfig(r);setMessages([...nm,{role:"assistant",content:disp||"All done — your configuration is ready below."}]);if(cfg)setConfig(cfg);}catch(e){setMessages([...nm,{role:"assistant",content:"I had trouble connecting. Please try again."}]);}setLoading(false);};
  const levelLabel=l=>({1:"Recipe Costing",2:"Yield Tracking",3:"Full Costing"}[l]||"-");
  const bubble=role=>({maxWidth:"85%",padding:"11px 15px",borderRadius:role==="user"?"14px 14px 3px 14px":"14px 14px 14px 3px",background:role==="user"?NAV:WHITE,color:role==="user"?WHITE:NAV,fontSize:15,lineHeight:1.55,border:role==="user"?"none":"1px solid "+BORDER,whiteSpace:"pre-wrap"});
  const code={fontFamily:"monospace",fontSize:11,background:SAND,padding:"1px 5px",borderRadius:3};
  const cfgCard={border:"1px solid "+BORDER,borderRadius:8,padding:14,marginBottom:12};
  const cfgH={fontSize:11,fontWeight:700,letterSpacing:.8,textTransform:"uppercase",color:MUTED,marginBottom:10};
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",background:SAND,color:NAV}}>
      <div style={{background:NAV,padding:"16px 20px",flexShrink:0}}>
        <div style={{fontSize:10,letterSpacing:2,textTransform:"uppercase",color:OCEAN,fontWeight:700,marginBottom:3}}>Passage · SupplierOps</div>
        <div style={{fontSize:15,color:SAND,fontWeight:600}}>Guided Setup</div>
      </div>
      {!started?(
        <div style={{flex:1,overflow:"auto",display:"flex",flexDirection:"column",alignItems:"center",padding:"40px 24px"}}>
          <div style={{maxWidth:560,width:"100%"}}>
            <div style={{fontSize:12,letterSpacing:2,textTransform:"uppercase",color:OCEAN,fontWeight:700,marginBottom:12,textAlign:"center"}}>Welcome to SupplierOps</div>
            <h1 style={{fontSize:26,fontWeight:700,color:NAV,marginBottom:12,lineHeight:1.3,textAlign:"center"}}>Let's set up your business — one conversation, no forms.</h1>
            <p style={{fontSize:15,color:MUTED,lineHeight:1.6,marginBottom:24,textAlign:"center"}}>I'll guide you through it, one question at a time. There are no wrong answers — if you don't know a number, just say so and I'll help.</p>

            <div style={{background:WHITE,border:"1px solid "+BORDER,borderRadius:12,padding:"20px 22px",marginBottom:20}}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:MUTED,marginBottom:6}}>Language</div>
              <div style={{display:"flex",gap:8}}>
                <button style={{padding:"9px 16px",borderRadius:8,border:"2px solid "+NAV,background:NAV,color:WHITE,fontSize:13,fontWeight:700,cursor:"default"}}>English</button>
                <button disabled style={{padding:"9px 16px",borderRadius:8,border:"1px solid "+BORDER,background:"#F0ECE4",color:MUTED,fontSize:13,fontWeight:500,cursor:"not-allowed"}}>Français (coming soon)</button>
              </div>
            </div>

            <div style={{background:WHITE,border:"1px solid "+BORDER,borderRadius:12,padding:"20px 22px",marginBottom:20}}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:MUTED,marginBottom:12}}>Before you start — it helps to have these handy</div>
              <ul style={{margin:0,paddingLeft:18,fontSize:14,color:NAV,lineHeight:1.9}}>
                <li>Your main product, and roughly how much you make in one production run</li>
                <li>Your ingredient prices, or recent supplier invoices</li>
                <li>Your latest gas and electricity bills</li>
                <li>Your current selling prices</li>
                <li>If you employ people — a rough idea of wages and hours</li>
              </ul>
              <div style={{fontSize:13,color:MUTED,marginTop:12,lineHeight:1.5}}>Don't have everything? That's fine — you can start with what you have and we'll use sensible estimates you can update later.</div>
            </div>

            <div style={{fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:MUTED,marginBottom:10,textAlign:"center"}}>What would you like to do?</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <button onClick={()=>start("first")} style={{padding:"15px 20px",borderRadius:10,border:"none",background:NAV,color:WHITE,fontSize:15,fontWeight:700,cursor:"pointer",textAlign:"left"}}>
                Set up for the first time
                <div style={{fontSize:12,fontWeight:400,color:"rgba(245,240,230,.7)",marginTop:3}}>New to SupplierOps — set up your business and your first product</div>
              </button>
              <button onClick={()=>start("returning")} style={{padding:"15px 20px",borderRadius:10,border:"1px solid "+BORDER,background:WHITE,color:NAV,fontSize:15,fontWeight:700,cursor:"pointer",textAlign:"left"}}>
                Add a new product
                <div style={{fontSize:12,fontWeight:400,color:MUTED,marginTop:3}}>Already set up — add another product to your business</div>
              </button>
            </div>
            <div style={{fontSize:11,color:MUTED,textAlign:"center",marginTop:16,lineHeight:1.5}}>Note: in this test version your answers aren't saved yet. "Add a new product" works as a preview — full reuse of your saved details comes when the tool is connected to the platform.</div>
          </div>
        </div>
      ):(
        <>
          <div ref={scrollRef} style={{flex:1,overflow:"auto",padding:"20px"}}>
            {messages.map((m,i)=>(<div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",marginBottom:14}}><div style={bubble(m.role)}>{m.content}</div></div>))}
            {loading&&(<div style={{display:"flex",justifyContent:"flex-start",marginBottom:14}}><div style={{...bubble("assistant"),color:MUTED}}>Thinking…</div></div>)}
            {config&&(
              <div style={{marginTop:20,background:WHITE,borderRadius:10,padding:18,border:"1px solid "+BORDER}}>
                <div style={{fontSize:13,fontWeight:700,color:NAV,marginBottom:4}}>Configuration Captured</div>
                <div style={{fontSize:12,color:MUTED,marginBottom:16}}>This is what your tool will be set up with.</div>
                <div style={cfgCard}><div style={cfgH}>Business</div><div style={{fontSize:14,fontWeight:600}}>{config.organisation?.name}</div><div style={{fontSize:12,color:MUTED,marginTop:4}}>Starting level: <strong style={{color:GOLD}}>{levelLabel(config.organisation?.maturity_level)}</strong> (Level {config.organisation?.maturity_level})</div></div>
                {config.products?.length>0&&(<div style={cfgCard}><div style={cfgH}>Products ({config.products.length})</div>{config.products.map((p,i)=>(<div key={i} style={{marginBottom:8}}><span style={code}>{p.code}</span> <strong style={{fontSize:13}}>{p.name}</strong><div style={{fontSize:11,color:MUTED,marginTop:2}}>Batch: {p.batch_size} {p.unit} · {p.channels?.join(", ")}</div></div>))}</div>)}
                {config.ingredients?.length>0&&(<div style={cfgCard}><div style={cfgH}>Ingredients ({config.ingredients.length})</div>{config.ingredients.map((g,i)=>(<div key={i} style={{marginBottom:6,fontSize:12}}><span style={code}>{g.code}</span> {g.name}{g.seasonal&&<span style={{padding:"1px 7px",borderRadius:100,fontSize:10,fontWeight:600,background:"#FEF3C7",color:"#92400E",marginLeft:6}}>Seasonal</span>}<span style={{color:MUTED}}> · yield {Math.round(g.ingredient_yield*100)}%</span></div>))}</div>)}
                {config.recipes?.length>0&&(<div style={cfgCard}><div style={cfgH}>Recipes ({config.recipes.length})</div>{config.recipes.map((r,i)=>(<div key={i} style={{marginBottom:8,fontSize:12}}><strong>{r.product_code}</strong>: {r.lines?.map(l=>l.qty_per_batch+l.unit+" "+l.ingredient_code).join(", ")}</div>))}</div>)}
                {config.cost_pools?.length>0&&(<div style={cfgCard}><div style={cfgH}>Cost Pools ({config.cost_pools.length})</div>{config.cost_pools.map((c,i)=>(<div key={i} style={{marginBottom:6,fontSize:12}}><strong>{c.name}</strong> — MUR {c.monthly_amount?.toLocaleString()}/mo<div style={{color:MUTED,fontSize:11}}>{c.driver} · {c.assigned_product_codes?.join(", ")}</div></div>))}</div>)}
                {config.labour_rates?.length>0&&(<div style={cfgCard}><div style={cfgH}>Labour ({config.labour_rates.length})</div>{config.labour_rates.map((l,i)=>(<div key={i} style={{marginBottom:4,fontSize:12}}><strong>{l.role}</strong> — MUR {l.rate_per_hour}/hr</div>))}</div>)}
                {config.pricing_configs?.length>0&&(<div style={cfgCard}><div style={cfgH}>Pricing ({config.pricing_configs.length})</div>{config.pricing_configs.map((p,i)=>(<div key={i} style={{marginBottom:4,fontSize:12}}><strong>{p.product_code}</strong> ({p.channel}): MUR {p.current_selling_price} · target {Math.round(p.target_margin*100)}%</div>))}</div>)}
                <button style={{width:"100%",padding:"12px",borderRadius:8,border:"none",background:GOLD,color:WHITE,fontSize:14,fontWeight:700,cursor:"pointer"}}>Confirm & Open SupplierOps →</button>
                <div style={{fontSize:11,color:MUTED,textAlign:"center",marginTop:8}}>On the live platform this saves your setup and opens your tool.</div>
              </div>
            )}
          </div>
          <div style={{padding:"14px 20px",borderTop:"1px solid "+BORDER,background:WHITE,flexShrink:0,display:"flex",gap:10}}>
            <textarea style={{flex:1,padding:"11px 15px",borderRadius:10,border:"1px solid "+BORDER,fontSize:15,color:NAV,resize:"none",maxHeight:120}} placeholder="Type your answer…" value={input} rows={1} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}} disabled={loading}/>
            <button onClick={send} disabled={loading||!input.trim()} style={{padding:"0 22px",borderRadius:10,border:"none",background:(loading||!input.trim())?BORDER:NAV,color:WHITE,fontSize:14,fontWeight:700,cursor:(loading||!input.trim())?"default":"pointer"}}>Send</button>
          </div>
        </>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
